allowBuilds:
  '@firebase/util': true
  core-js: true
  esbuild: true
  msgpackr-extract: true
  protobufjs: true
  sharp: true
  unrs-resolver: true

# Supply-chain hardening: reject packages published less than 7 days ago
# (gives the ecosystem time to catch malicious releases before they reach us)
minimumReleaseAge: '10080 minutes'
